<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#292620">
    <meta name="description" content="Daniel Ryu’s playable pinball workshop. Follow the brass rails to projects and experience.">
    <link rel="icon" href="/flipper.svg" type="image/svg+xml">
    <link rel="preload" href="/models/workshop.glb" as="fetch" crossorigin>
    <link rel="stylesheet" href="/src/room.css">
    <title>Daniel Ryu · The Pinball Workshop</title>
  </head>
  <body>
    <main id="room" aria-label="Daniel Ryu’s pinball workshop">
      <h1 class="sr-only">Daniel Ryu’s pinball workshop</h1>
      <canvas id="room-view" tabindex="0" aria-label="Playable pinball machine. Drag the steel ball toward the spring and release. Hold and release Space to launch. Use the arrow keys for the flippers. Use the workshop guide for keyboard navigation."></canvas>
      <div class="utility">
        <button type="button" id="sound" class="round-control" aria-label="Enable sound" aria-pressed="false" title="Enable sound"></button>
        <button type="button" id="guide" class="round-control" aria-label="Workshop guide" title="Workshop guide">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8.5"/><path d="M9.7 9.7a2.4 2.4 0 0 1 4.8 0c0 1.6-2.5 1.8-2.5 3.7"/><circle cx="12" cy="16.5" r=".65" fill="currentColor"/></svg>
        </button>
      </div>
      <div id="loading" role="status"><span class="loading-lamp"></span><span>Opening the workshop…</span></div>
      <div id="hover" hidden></div>
      <div class="bottom-tools">
        <button type="button" id="back" class="glass-button" hidden>← &nbsp; Back to the flippers</button>
        <span id="cue" class="hint" hidden></span>
        <button type="button" id="resume" class="glass-button" hidden>Resume ball</button>
      </div>
      <div id="touch-paddles" hidden><button data-side="left" aria-label="Left flipper">↖</button><button data-side="right" aria-label="Right flipper">↗</button></div>
      <div id="live" class="sr-only" role="status" aria-live="polite"></div>
      <dialog id="guide-panel" aria-labelledby="guide-title">
        <form method="dialog"><button class="close" aria-label="Close guide" value="close">×</button></form>
        <h2 id="guide-title">Workshop guide</h2>
        <p id="guide-description">Pull the steel ball against the spring and release. Use the flippers to take a shot, or select a destination on the machine.</p>
        <div class="guide-keys"><span><kbd>Space</kbd> Hold to launch</span><span><kbd>←</kbd><kbd>→</kbd> Flippers</span></div>
        <div id="guide-actions"></div>
        <nav aria-label="Workshop destinations">
          <button data-route="table">Flippers</button><button data-route="projects">Projects</button><button data-route="experience">Experience</button>
          <a href="/daniel-ryu-resume.pdf" target="_blank" rel="noopener">Résumé PDF ↗</a>
        </nav>
      </dialog>
      <noscript><style>#loading,.utility{display:none}</style><section class="fallback"><h2>Daniel Ryu</h2><p>Computer science and mathematics at Illinois. Projects include Cline Financial. Experience includes Fidelity, NOBE, and KATUSA.</p><a href="/daniel-ryu-resume.pdf">Read my résumé</a> · <a href="https://github.com/DanielRyu318">GitHub</a></section></noscript>
    </main>
    <script type="module" src="/src/room-app.js"></script>
  </body>
</html>
